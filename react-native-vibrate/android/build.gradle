apply plugin: 'com.android.library'

react {}

android {
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        consumerProguardFiles 'consumer-rules.pro'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/java'
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
}
